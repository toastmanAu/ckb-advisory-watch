# Supply-chain compromise campaigns.
#
# Distinct from the advisory pipeline: these aren't CVEs, they're
# package names the operator has reason to believe were *themselves*
# the payload of a supply-chain attack (typosquatting, account takeover,
# maintainer compromise, etc).
#
# Schema:
#   campaigns:
#     - id: short-slug                   # required, unique
#       title: human readable            # required
#       first_seen: YYYY-MM-DD           # optional
#       references:                      # optional, list of URLs
#         - https://...
#       indicators:                      # list of (ecosystem, name) entries
#         - {ecosystem: npm,  name: "@scope/exact-package"}
#         - {ecosystem: npm,  name: "@scope/*"}             # glob via SQL LIKE; * → %
#         - {ecosystem: pypi, name: "exact-pkg"}
#       affected_versions: |             # optional free-text note for the report
#         Confirmed compromised: 1.169.x. Safe: 1.168.10 and earlier.
#
# Ecosystems must match values in project_dep.ecosystem
# (current: npm, crates.io, Go). Glob is SQL LIKE — use * which is rewritten to %.

campaigns:
  - id: shai-hulud-tanstack-2026-05
    title: Shai-Hulud / TanStack compromise (mini, May 2026)
    first_seen: 2026-05-11
    references:
      - https://socket.dev/blog
    indicators:
      - {ecosystem: npm, name: "@tanstack/router"}
      - {ecosystem: npm, name: "@tanstack/react-router"}
      - {ecosystem: npm, name: "@tanstack/query-core"}
      - {ecosystem: npm, name: "@tanstack/react-query"}
    affected_versions: |
      Compromised: @tanstack/router@1.169.8, @tanstack/query-core@1.166.56 (and adjacent).
      Safe: @tanstack/router<=1.168.10, @tanstack/query-core<=1.166.27.

  - id: mini-shai-hulud-ai-tooling-2026-05
    title: Mini Shai-Hulud — AI developer tooling fan-out (May 2026)
    first_seen: 2026-05-12
    references:
      - https://socket.dev/blog
    indicators:
      # NOTE: These are vendor-scope placeholders. Replace with confirmed
      # IoC package names as they're published. Glob `*` matches any suffix.
      - {ecosystem: npm,  name: "@opensearch-project/*"}
      - {ecosystem: npm,  name: "@mistralai/*"}
      - {ecosystem: pypi, name: "mistralai"}
      - {ecosystem: npm,  name: "@guardrails-ai/*"}
      - {ecosystem: pypi, name: "guardrails-ai"}
      - {ecosystem: npm,  name: "@uipath/*"}
      - {ecosystem: pypi, name: "uipath"}
      - {ecosystem: npm,  name: "squawk"}
      - {ecosystem: npm,  name: "squawk-*"}
      - {ecosystem: pypi, name: "squawk"}
    affected_versions: |
      Specific compromised versions TBC. Mini-Shai-Hulud variant persists via
      .claude/settings.json hooks and .vscode/tasks.json — npm uninstall alone
      does not remediate. See safety-check.sh hook detector.

